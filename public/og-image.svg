<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Vorschaubild fuer geteilte Links (og:image). Nur Aussagen, die die
       Startseite auch macht — keine Wirkungsversprechen, keine Zahlen
       ohne Beleg. PNG daneben ist daraus gerendert. -->
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#FF8C00" stroke-width="0.4" opacity="0.10"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="#002C51"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect x="0" y="0" width="1200" height="8" fill="#FF8C00"/>
  <rect x="0" y="0" width="8" height="630" fill="#FF8C00"/>

  <text x="80" y="112" font-family="'Barlow Condensed', 'Arial Narrow', Arial, sans-serif" font-weight="900" font-size="50" letter-spacing="6" fill="#FFFFFF">WERKRUF</text>
  <rect x="80" y="126" width="210" height="5" fill="#FF8C00"/>

  <text x="80" y="246" font-family="'Barlow Condensed', 'Arial Narrow', Arial, sans-serif" font-weight="900" font-size="82" fill="#FFFFFF">DEINE ARBEIT IST BESSER,</text>
  <text x="80" y="332" font-family="'Barlow Condensed', 'Arial Narrow', Arial, sans-serif" font-weight="900" font-size="82" fill="#FF8C00">ALS DEIN PROFIL VERMUTEN LÄSST.</text>

  <text x="80" y="410" font-family="Barlow, Arial, sans-serif" font-size="29" fill="#C9D6E2">Dein Google-Unternehmensprofil im Blick: Bewertungen beantworten,</text>
  <text x="80" y="450" font-family="Barlow, Arial, sans-serif" font-size="29" fill="#C9D6E2">Angaben aktuell halten, montags eine Mail mit dem, was zu tun ist.</text>

  <rect x="80" y="510" width="1040" height="1" fill="#FFFFFF" fill-opacity="0.18"/>
  <text x="80" y="566" font-family="Barlow, Arial, sans-serif" font-weight="500" font-size="27" fill="#FFFFFF">Für Handwerksbetriebe · 30 Tage kostenlos · 49 € / Monat</text>
  <text x="1120" y="566" text-anchor="end" font-family="'Barlow Condensed', 'Arial Narrow', Arial, sans-serif" font-weight="800" font-size="30" letter-spacing="2" fill="#FF8C00">WERKRUF.COM</text>
</svg>
