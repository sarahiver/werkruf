name: Lockfile erzeugen

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: package-lock.json erzeugen
        run: npm install --package-lock-only --no-audit --no-fund

      - name: Diagnose
        run: |
          echo "── eslint ──"
          npm ls eslint --all 2>&1 | head -20 || true
          echo "── eslint-plugin-jest ──"
          npm ls eslint-plugin-jest --all 2>&1 | head -20 || true

      - name: Committen
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add package-lock.json
          git commit -m "package-lock.json aus CI erzeugt" || echo "keine Änderung"
          git push
