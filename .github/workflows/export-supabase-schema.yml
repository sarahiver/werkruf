name: Export Supabase Schema

on:
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Export schema
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_POOLER_DB_URL }}
        run: |
          mkdir -p schema-export
          pg_dump \
            --schema-only \
            --no-owner \
            --no-privileges \
            --schema=public \
            "$DATABASE_URL" \
            > schema-export/werkruf-schema.sql

      - name: Verify dump
        run: |
          wc -l schema-export/werkruf-schema.sql
          ls -lh schema-export/werkruf-schema.sql

      - name: Upload schema artifact
        uses: actions/upload-artifact@v4
        with:
          name: werkruf-supabase-schema
          path: schema-export/werkruf-schema.sql
