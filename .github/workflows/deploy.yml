name: Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:

  # ── Frontend pruefen ──────────────────────────────────────────────
  # CI=true macht aus CRA-Warnungen Fehler. Das faengt genau die
  # Fehlerklasse ab, an der ein frueherer Deploy scheiterte:
  # setShowGhostSetup is not defined. esbuild findet undefinierte
  # Variablen nicht, ESLint schon.
  #
  # npm install statt npm ci: Es gibt noch kein brauchbares
  # package-lock.json. react-scripts@5 zieht typescript als optionale
  # Peer-Abhaengigkeit herein, npm waehlt die neueste (7.x), und npm ci
  # lehnt das anschliessend ab. Der Pin auf typescript 4.9.5 in der
  # package.json soll das beheben — sobald der Lockfile-Workflow
  # durchlaeuft, kann hier wieder npm ci und cache: npm stehen.
  lint-and-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install --no-audit --no-fund

      - name: Lint und Build
        run: CI=true npm run build

  # ── Edge Functions pruefen ────────────────────────────────────────
  check-functions:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x

      - name: Typpruefung
        # Deno prueft Typen und aufloesbare Importe. Ein Tippfehler in
        # einem Modulpfad faellt hier auf, nicht erst im Produktivlauf.
        run: |
          for f in supabase/functions/*/index.ts; do
            echo "── $f"
            deno check "$f" || exit 1
          done

      - name: Tests
        run: |
          if [ -d supabase/tests ] && ls supabase/tests/*.test.ts >/dev/null 2>&1; then
            deno test --allow-net supabase/tests/
          else
            echo "Keine Tests gefunden — uebersprungen"
          fi

  # ── Deployen ──────────────────────────────────────────────────────
  deploy-functions:
    needs: [lint-and-build, check-functions]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Functions deployen
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        # Deployt alle Ordner unter supabase/functions. Die CLI ueber-
        # springt unveraenderte Functions ("No change found").
        # Achtung: config.toml darf keine Abschnitte fuer Functions
        # enthalten, deren Ordner fehlt — daran bricht der Deploy ab.
        run: supabase functions deploy --project-ref kueoozsfkevmncucrdjd

# Migrationen werden BEWUSST nicht automatisch eingespielt.
# Ein fehlerhafter Push wuerde sonst das Schema der Produktivdatenbank
# aendern, ohne dass jemand hinsieht. Migrationen bleiben ein
# bewusster Schritt im SQL Editor.
