# Supabase-Projektkonfiguration
#
# Haelt fest, welche Function ihr JWT pruefen laesst. Bisher war das eine
# Dashboard-Einstellung, die nirgends dokumentiert war und beim Deploy
# still zurueckspringen kann.
#
# ⚠️  Es darf hier KEIN Abschnitt fuer eine Function stehen, deren Ordner
#     unter supabase/functions/ fehlt — daran bricht der Deploy ab
#     ("entrypoint path does not exist"). Genau das ist am 11.09. nach
#     dem Loeschen von check-trial-emails und send-welcome-email passiert.

project_id = "kueoozsfkevmncucrdjd"

# Mail-Secrets shared by send-email and ops-alert:
#   EMAIL_DELIVERY_MODE=production
# In preview/test environments always use:
#   EMAIL_DELIVERY_MODE=test
#   EMAIL_TEST_RECIPIENT=<controlled inbox>
# Test mode rewrites every Brevo recipient and must never use customer data.

# ── Ohne JWT ─────────────────────────────────────────────────────────
# Aufrufer ohne Authorization-Header: Google-Callback, pg_cron, Stripe.
# Jede dieser Functions hat einen eigenen Schutz im Code.

[functions.google-business]
# Google redirectet den Browser auf /callback, ohne Header.
# Schutz: requireUser() auf allen anderen Routen, state auf /callback,
# X-Worker-Secret auf den Worker-Routen.
verify_jwt = false

[functions.send-email]
# Aufruf von pg_cron. Schutz: X-Worker-Secret.
verify_jwt = false

[functions.request-profile-report]
# Public, registration-free endpoint. Protection is implemented in the
# function: strict validation, atomic database rate limit, optional Turnstile,
# daily deduplication and a server-side Places lookup.
verify_jwt = false

[functions.smartcheck-lead]
# Oeffentlicher, registrierungsfreier Endpunkt fuer den SmartCheck.
#
# Warum ohne JWT: der SmartCheck laeuft vor jeder Registrierung. Ein
# Besucher hat keinen Token.
#
# Warum trotzdem nicht offen: der Schutz steht in der Function —
# Herkunftspruefung gegen PUBLIC_REPORT_ALLOWED_ORIGINS, strikte
# Validierung mit Laengengrenzen, atomares Rate-Limit ueber
# check_rate_limit je IP und je gehashter E-Mail, Doppelungsfenster von
# einer Stunde, Write ausschliesslich mit der Service Role.
#
# Der Grund, warum es diesen Endpunkt gibt und kein "grant insert on
# leads to anon": der anon-Schluessel liegt im Browser-Bundle. Siehe
# Kopf von supabase/functions/smartcheck-lead/index.ts.
verify_jwt = false

[functions.stripe-webhook]
# Stripe sendet keinen Authorization-Header.
# Schutz: Signaturpruefung gegen STRIPE_WEBHOOK_SECRET (Pflicht).
verify_jwt = false

[functions.gbp-api-monitor]
# Aufruf von pg_cron. Schutz: X-Worker-Secret.
# Liest ausschliesslich oeffentliche Google-Dokumente, ruft keine
# Google-API im Namen des Projekts auf und veraendert keine Kundendaten.
verify_jwt = false

[functions.ops-alert]
# Aufruf von pg_cron. Schutz: X-Worker-Secret.
# Bewusst eigenstaendig statt als Route in send-email: ein Alarm, der
# die ueberwachte Maschinerie nutzt, kann deren Ausfall nicht melden.
verify_jwt = false

# ── Mit JWT ──────────────────────────────────────────────────────────
# Werden aus dem Frontend mit gueltiger Session aufgerufen.
#
# ═══════════════════════════════════════════════════════════════
# verify_jwt = false SEIT 21.10.2026 — UND WARUM DAS NICHTS OEFFNET
# ═══════════════════════════════════════════════════════════════
#
# Befund: /admin lieferte 401 von admin-ops, bevor die Function lief
# (execution_id leer). Der Token im Request traegt alg = ES256 — das
# Projekt signiert JWTs seit der Umstellung auf die neuen API-Keys
# (sb_publishable_…) asymmetrisch. Das Edge-Function-Gateway weist
# diese Tokens ab, obwohl sie gueltig sind:
#
#   github.com/supabase/supabase/issues/42244  (offen; Maintainer:
#   "already working on best solutions", Workaround: --no-verify-jwt
#   und getUser() in der Function)
#
# Betroffen waren damit ALLE sechs Functions unten — nicht nur der
# Admin: KI-Antworten, Checkout, Kundenportal, Kontoloeschung,
# Foto-Upload. Fuer jeden Nutzer mit frischem Token.
#
# Warum false hier keine Luecke ist: Jede der sechs prueft den Nutzer
# SELBST, ueber supabase.auth.getUser() mit dem Authorization-Header
# des Aufrufers — und der Auth-Server prueft ES256 problemlos. Das
# Gateway war eine zweite Pruefung VOR der eigentlichen, nicht die
# eigentliche. google-business laeuft seit jeher so (requireUser).
#
# Eine Function, die den Nutzer NICHT selbst prueft, darf hier nicht
# auf false — dann staende sie offen. Vor dem Umschalten geprueft am
# 21.10.2026: alle sechs rufen getUser() auf.
#
# Zurueck auf true, sobald Supabase das Gateway repariert hat.

[functions.generate-review-reply]
verify_jwt = false

[functions.create-checkout-session]
verify_jwt = false

[functions.create-portal-session]
verify_jwt = false

[functions.delete-account]
verify_jwt = false

[functions.cloudinary-sign-upload]
verify_jwt = false

[functions.admin-ops]
verify_jwt = false
