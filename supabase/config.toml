# Supabase-Projektkonfiguration
#
# Haelt fest, welche Function ihr JWT pruefen laesst. Bisher war das eine
# Dashboard-Einstellung, die nirgends dokumentiert war und beim Deploy
# still zurueckspringen kann.
#
# ⚠️  Es darf hier KEIN Abschnitt fuer eine Function stehen, deren Ordner
#     unter supabase/functions/ fehlt — daran bricht der Deploy ab
#     ("entrypoint path does not exist"). Genau das ist am 11.09. nach
#     dem Loeschen von check-trial-emails und send-welcome-email passiert.

project_id = "kueoozsfkevmncucrdjd"

# Mail-Secrets shared by send-email and ops-alert:
#   EMAIL_DELIVERY_MODE=production
# In preview/test environments always use:
#   EMAIL_DELIVERY_MODE=test
#   EMAIL_TEST_RECIPIENT=<controlled inbox>
# Test mode rewrites every Brevo recipient and must never use customer data.

# ── Ohne JWT ─────────────────────────────────────────────────────────
# Aufrufer ohne Authorization-Header: Google-Callback, pg_cron, Stripe.
# Jede dieser Functions hat einen eigenen Schutz im Code.

[functions.google-business]
# Google redirectet den Browser auf /callback, ohne Header.
# Schutz: requireUser() auf allen anderen Routen, state auf /callback,
# X-Worker-Secret auf den Worker-Routen.
verify_jwt = false

[functions.send-email]
# Aufruf von pg_cron. Schutz: X-Worker-Secret.
verify_jwt = false

[functions.stripe-webhook]
# Stripe sendet keinen Authorization-Header.
# Schutz: Signaturpruefung gegen STRIPE_WEBHOOK_SECRET (Pflicht).
verify_jwt = false

[functions.ops-alert]
# Aufruf von pg_cron. Schutz: X-Worker-Secret.
# Bewusst eigenstaendig statt als Route in send-email: ein Alarm, der
# die ueberwachte Maschinerie nutzt, kann deren Ausfall nicht melden.
verify_jwt = false

# ── Mit JWT ──────────────────────────────────────────────────────────
# Werden aus dem Frontend mit gueltiger Session aufgerufen.

[functions.generate-review-reply]
verify_jwt = true

[functions.create-checkout-session]
verify_jwt = true

[functions.create-portal-session]
verify_jwt = true

[functions.delete-account]
verify_jwt = true

[functions.cloudinary-sign-upload]
verify_jwt = true
